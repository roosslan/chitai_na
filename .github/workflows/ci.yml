# Сборка, тесты и релизы chitai_na.
# push/PR: сборка Release x64, тесты, cab-пакет и установщик XPSetup в артефактах.
# Тег v* (например, v3.24.10.26): то же самое + проверка версии и релиз на GitHub.

name: CI

on:
  push:
    branches: [trunk, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Сборка
        run: msbuild chitai_na.sln /m /nologo /p:Configuration=Release /p:Platform=x64

      - name: Тесты
        run: x64\Release\chitai_na_tests.exe --exe x64\Release\chitai_na.exe --mp4 mp4

      - name: Проверка версии тега
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')

          $parts = [System.Collections.Generic.List[string]]$tag.Split('.')

          while ($parts.Count -lt 4) {
            $parts.Add('0')
          }

          $expected = $parts -join '.'

          $actual = (
            Select-String `
              -Path src/version.h `
              -Pattern 'FILE_VERSIONSTRING\s+"([0-9.]+)'
          ).Matches[0].Groups[1].Value

          if ($actual -ne $expected) {
            Write-Error "Тег ${{ github.ref_name }} не совпадает с версией $actual в src/version.h"
            exit 1
          }

      # ------------------------------------------------------------------
      # Установщик XPSetup
      # ------------------------------------------------------------------
      - name: Версия
        id: version
        shell: pwsh
        run: |
          $v = (
            Select-String `
              -Path src/version.h `
              -Pattern 'FILE_VERSIONSTRING\s+"([0-9.]+)'
          ).Matches[0].Groups[1].Value

          "version=$v" >> $env:GITHUB_OUTPUT

      # Action закреплён на полном SHA, сборщик скачивается из указанного релиза.
      # При недоступности релиза шаг завершится ошибкой без сборки из исходников.
      - name: Установщик
        id: installer
        uses: roosslan/cabxp64_installer@cdd733ab7f94864ed206bf397c6829f160ebdf4c
        with:
          xpsetup-version: v1.0.0
          project: installer/chitai_na.xsp
          version: ${{ steps.version.outputs.version }}
          out: dist/installer

      - name: Проверка установщика
        shell: pwsh
        env:
          INSTALLER_SINGLE: ${{ steps.installer.outputs.single }}
          INSTALLER_ZIP: ${{ steps.installer.outputs.zip }}
        run: |
          foreach ($path in @($env:INSTALLER_SINGLE, $env:INSTALLER_ZIP)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Файл установщика не создан: '$path'"
            }
            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Пустой файл установщика: $path"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: chitai_na-setup
          path: |
            ${{ steps.installer.outputs.single }}
            ${{ steps.installer.outputs.zip }}

      # ------------------------------------------------------------------
      # Создание CAB
      # ------------------------------------------------------------------
      - name: Пакет CAB
        shell: pwsh
        run: |
          $suffix = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'
          } else {
            '${{ github.sha }}'.Substring(0, 7)
          }

          $name = "chitai_na-$suffix-x64"
          $packageDir = (New-Item -ItemType Directory -Force "dist\$name").FullName
          $cabDir = (New-Item -ItemType Directory -Force "dist\cab").FullName

          # Копируем файлы программы
          Copy-Item `
            x64\Release\chitai_na.exe, `
            LICENSE, `
            readme.md `
            $packageDir

          # Копируем каталог mp4
          Copy-Item mp4 $packageDir -Recurse

          # Получаем список всех файлов
          $files = Get-ChildItem $packageDir -Recurse -File

          # DDF-файл для makecab
          $ddf = Join-Path $env:RUNNER_TEMP "chitai_na.ddf"

          @"
          .OPTION EXPLICIT
          .Set CabinetNameTemplate=$name.cab
          .Set DiskDirectoryTemplate=$cabDir
          .Set MaxDiskSize=0
          .Set CompressionType=LZX
          .Set CompressionMemory=21
          .Set Cabinet=on
          .Set Compress=on
          .Set InfFileName=NUL

          "@ | Set-Content -Path $ddf -Encoding ASCII

          foreach ($file in $files) {
            $relative = $file.FullName.Substring($packageDir.Length + 1)

            # В DDF нужен путь к исходному файлу и имя внутри CAB
            Add-Content `
              -Path $ddf `
              -Value "`"$($file.FullName)`" `"$relative`""
          }

          Write-Host "Создание CAB..."
          Write-Host "DDF: $ddf"

          makecab.exe /F "$ddf"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "makecab завершился с ошибкой: $LASTEXITCODE"
            exit 1
          }

          $cab = Join-Path $cabDir "$name.cab"

          if (-not (Test-Path $cab)) {
            Write-Error "CAB-файл не создан: $cab"
            exit 1
          }

          Write-Host ""
          Write-Host "Создан пакет:"
          Get-Item $cab | Format-List FullName, Length

      # Проверяем наличие и размер CAB перед загрузкой
      - name: Проверка CAB
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist\cab -Filter *.cab -File)
          if ($files.Count -eq 0) { throw 'CAB-файлы не созданы' }
          foreach ($file in $files) {
            if ($file.Length -eq 0) { throw "Пустой CAB-файл: $($file.FullName)" }
          }

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: chitai_na-x64
          path: dist/cab/*.cab

  # --------------------------------------------------------------------
  # GitHub Release
  # --------------------------------------------------------------------
  release:
    needs: build
    if: github.ref_type == 'tag'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chitai_na-*
          merge-multiple: true

      - name: Проверка артефакта
        run: |
          shopt -s nullglob
          for extension in cab exe zip; do
            files=( *."$extension" )
            if (( ${#files[@]} == 0 )); then
              echo "Нет файлов .$extension" >&2
              exit 1
            fi
            for file in "${files[@]}"; do
              if [[ ! -f "$file" || ! -s "$file" ]]; then
                echo "Артефакт отсутствует или пуст: $file" >&2
                exit 1
              fi
            done
          done

      - name: Релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" *.cab *.exe *.zip \
            --repo "${{ github.repository }}" \
            --title "chitai na ${{ github.ref_name }}" \
            --generate-notes